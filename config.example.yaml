# LLM configuration
llm:
  provider: ollama
  model: qwen3-coder:latest
  endpoint: http://localhost:11434/v1
  api_key_env_var: LLM_API_KEY

#terraform flavor
terraform:
  variant: terraform # options: works well with any terraform variants, I tested terraform, tofu, tflocal

# Watch configuration
watch:
  environments:
    - name: production
      paths:
        - <absolute_path_to_your_terraform_repository>
      resources:
        includes:
          - aws_instance.web_server
          - aws_vpc_*
        excludes:
          - aws_instance.db_server
# Drift configuration
drift_detection:
  interval_seconds: 30

# Output configuration
output:
  log_level: info
  log_file: /var/log/drift_detection.log
  failure_log_file: /var/log/drift_detection_failures.log
