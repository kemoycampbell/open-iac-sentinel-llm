# LLM configuration
llm:
  provider: ollama
  model: qwen3-coder
  endpoint: http://localhost:11434/v1
  api_key_env_var: OLLAMA_API_KEY

# Watch configuration
watch:
  environments:
    - name: production
      paths:
        - C:/Users/kscics/Desktop/engineering-cloud-software-system/docker-wp
      resources:
        includes:
          - aws_instance.web_server
          - aws_vpc_*
        excludes:
          - aws_instance.db_server
# Drift configuration
drift_detection:
  interval_seconds: 30

# Output configuration
output:
  log_level: info
  log_file: /var/log/drift_detection.log
